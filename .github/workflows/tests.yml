name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Run backend tests
        working-directory: ./backend
        run: pytest
        env:
          PYTHONPATH: ${PYTHONPATH}:${PWD}

      - name: Run backend smoke test
        run: python backend/scripts/smoke_process_pdf.py

      - name: Check backend server startup
        working-directory: ./backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/openapi.json; then
              kill "$server_pid"
              exit 0
            fi
            sleep 1
          done
          echo "Backend server did not respond on /openapi.json"
          kill "$server_pid" || true
          exit 1
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node.js dependencies
        working-directory: ./frontend
        run: |
          node --version
          npm --version
          npm config list
          npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend smoke test
        working-directory: ./frontend
        run: npm run test:smoke
